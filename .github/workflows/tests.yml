name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '10.*', testbench: '^8.0', database: sqlite }
          - { php: '8.3', laravel: '11.*', testbench: '^9.0', database: sqlite }
          - { php: '8.4', laravel: '12.*', testbench: '^10.0', database: sqlite }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', database: sqlite }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', database: mysql }
          - { php: '8.4', laravel: '13.*', testbench: '^11.0', database: pgsql }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests (sqlite)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest

      - name: Run tests (mysql)
        if: matrix.database == 'mysql'
        env:
          SOCIALITE_TEST_DB_DRIVER: 'mysql'
          SOCIALITE_TEST_DB_HOST: '127.0.0.1'
          SOCIALITE_TEST_DB_PORT: '3306'
          SOCIALITE_TEST_DB_USERNAME: 'root'
          SOCIALITE_TEST_DB_PASSWORD: ''
          SOCIALITE_TEST_DB_DATABASE: 'testing'
        run: vendor/bin/pest

      - name: Run tests (pgsql)
        if: matrix.database == 'pgsql'
        env:
          SOCIALITE_TEST_DB_DRIVER: 'pgsql'
          SOCIALITE_TEST_DB_HOST: '127.0.0.1'
          SOCIALITE_TEST_DB_PORT: '5432'
          SOCIALITE_TEST_DB_USERNAME: 'postgres'
          SOCIALITE_TEST_DB_PASSWORD: 'postgres'
          SOCIALITE_TEST_DB_DATABASE: 'testing'
        run: vendor/bin/pest
